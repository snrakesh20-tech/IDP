    const Icon=({name,size=18})=>{const paths={sparkle:<><path d="m12 3 1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3Z"/><path d="m19 14 .9 2.1L22 17l-2.1.9L19 20l-.9-2.1L16 17l2.1-.9L19 14Z"/></>,grid:<><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></>,layers:<><path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 12 9 5 9-5M3 16l9 5 9-5"/></>,clock:<><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></>,settings:<><circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1a1.8 1.8 0 1 1-2.5 2.5l-.1-.1a1.8 1.8 0 0 0-3 .9v.2a1.8 1.8 0 1 1-3.6 0v-.2a1.8 1.8 0 0 0-3-.9l-.1.1a1.8 1.8 0 1 1-2.5-2.5l.1-.1a1.8 1.8 0 0 0-.9-3H3.7a1.8 1.8 0 1 1 0-3.6h.2a1.8 1.8 0 0 0 .9-3l-.1-.1a1.8 1.8 0 1 1 2.5-2.5l.1.1a1.8 1.8 0 0 0 3-.9v-.2a1.8 1.8 0 1 1 3.6 0v.2a1.8 1.8 0 0 0 3 .9l.1-.1a1.8 1.8 0 1 1 2.5 2.5l-.1.1a1.8 1.8 0 0 0 .9 3h.2a1.8 1.8 0 1 1 0 3.6h-.2a1.8 1.8 0 0 0-.9 3Z"/></>,bell:<><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></>,chevron:<path d="m9 18 6-6-6-6"/>,upload:<><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5M12 3v12"/></>,file:<><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9Z"/><path d="M13 2v7h7M8 14h8M8 18h8"/></>,shield:<><path d="M12 22s8-4 8-11V5l-8-3-8 3v6c0 7 8 11 8 11Z"/><path d="m9 12 2 2 4-4"/></>,database:<><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.7 4 3 9 3s9-1.3 9-3V5M3 12c0 1.7 4 3 9 3s9-1.3 9-3"/></>,check:<path d="m5 12 4 4L19 6"/>,help:<><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 4.2 1.8c-.9.8-1.7 1.2-1.7 2.7M12 17h.01"/></>};return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">{paths[name]}</svg>};
    const SourceCard=({id,title,description,kind,logo,selected,onChoose})=><div className={'source-card '+(selected?'selected':'')} onClick={onChoose} role="radio" aria-checked={selected} tabIndex="0" onKeyDown={e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();onChoose()}}}><div className="card-top"><div className={'source-logo '+logo}><Icon name={id==='file'?'file':'database'} size={19}/></div>{selected?<span className="select-mark"><Icon name="check" size={11}/></span>:<span className="select-mark"/>}</div><h3>{title}</h3><p>{description}</p><div className="card-foot"><span className="source-kind">{kind}</span>{id==='file'?<span className="available"><i className="available-dot"/>Available now</span>:<span className="soon"><i className="soon-dot"/>Coming soon</span>}</div></div>;
    const streams=[
      {id:'r2r',code:'R2R',name:'Record to Report',desc:'Finance, accounting, close, consolidation and financial reporting.',aliases:'FINANCE · GENERAL LEDGER'},
      {id:'s2p',code:'S2P',name:'Source to Pay',desc:'Supplier sourcing, purchasing, receiving, invoicing and payment.',aliases:'S2S · P2P · PROCUREMENT'},
      {id:'l2c',code:'L2C',name:'Lead to Cash',desc:'Customer engagement, sales orders, fulfillment, billing and collection.',aliases:'O2C · OTC · SALES'},
      {id:'p2f',code:'P2F',name:'Plan to Fulfill',desc:'Demand and supply planning, production, inventory and delivery.',aliases:'SUPPLY CHAIN · MANUFACTURING'},
      {id:'h2r',code:'H2R',name:'Recruit to Retire',desc:'Workforce planning, recruiting, employee lifecycle and payroll.',aliases:'HR · HCM · TALENT'},
      {id:'i2m',code:'I2M',name:'Idea to Market',desc:'Product strategy, research, engineering and product lifecycle.',aliases:'R&D · PLM · PRODUCT'},
      {id:'a2d',code:'A2D',name:'Acquire to Decommission',desc:'Asset acquisition, operation, maintenance and retirement.',aliases:'EAM · ASSET MANAGEMENT'},
      {id:'grc',code:'GRC',name:'Governance, Risk & Compliance',desc:'Controls, risk, regulatory compliance and audit across processes.',aliases:'CROSS-PROCESS · CONTROLS'}
    ];
    const dimensions=[
      {id:'integrity',name:'Integrity',desc:'Keep related records and references aligned.'},
      {id:'consistency',name:'Consistency',desc:'Use consistent values and representations.'},
      {id:'uniqueness',name:'Uniqueness',desc:'Find and handle duplicate records.'},
      {id:'conformity',name:'Conformity',desc:'Match required formats and conventions.'},
      {id:'completeness',name:'Completeness',desc:'Check required fields and missing values.'},
      {id:'accuracy',name:'Accuracy',desc:'Validate values against trusted information.'},
      {id:'validity',name:'Validity',desc:'Enforce allowed values, ranges, and rules.'},
      {id:'timeliness',name:'Timeliness',desc:'Check freshness and date expectations.'}
    ];
    const starterRules=[
      {id:1,name:'Remove duplicate records',field:'Record key · invoice ID · supplier ID',dimension:'uniqueness',group:'standard',category:'Duplicate handling',description:'Identify repeated rows using the selected record key and keep the most complete record.',impact:'Prevents duplicate records from inflating counts or downstream processing.'},
      {id:2,name:'Standardize supplier names',field:'Supplier name · supplier ID',dimension:'accuracy',group:'business',category:'Entity standardization',description:'Match common spelling, casing, and punctuation variants to one canonical supplier name.',impact:'Keeps supplier records and reporting aligned to the correct business entity.'},
      {id:3,name:'Normalize date formats',field:'Document date · posting date',dimension:'conformity',group:'standard',category:'Date normalization',description:'Convert recognized date formats into one consistent format and flag ambiguous values.',impact:'Keeps date-based reporting and period comparisons consistent.'},
      {id:4,name:'Check required finance fields',field:'Company code · G/L account · currency',dimension:'completeness',group:'business',category:'Required field validation',description:'Flag records that are missing required finance fields before downstream use.',impact:'Reduces incomplete records reaching finance reporting or posting workflows.'},
      {id:5,name:'Trim whitespace and normalize text',field:'Text · descriptions · IDs',dimension:'consistency',group:'standard',category:'Text normalization',description:'Remove leading or trailing spaces and normalize text casing where it does not change meaning.',impact:'Improves matching, filtering, and consistent reporting.'},
      {id:6,name:'Validate related record references',field:'Company code · account · document ID',dimension:'integrity',group:'business',category:'Relationship validation',description:'Flag references that do not match a related record or configured lookup.',impact:'Helps prevent broken links between source records and downstream finance records.'},
      {id:7,name:'Check allowed values and ranges',field:'Currency · status · amount',dimension:'validity',group:'standard',category:'Value validation',description:'Flag values outside the allowed list, format, or configured range.',impact:'Reduces invalid values entering downstream processes and reports.'},
      {id:8,name:'Flag stale records',field:'Created date · update date',dimension:'timeliness',group:'business',category:'Freshness check',description:'Identify records older than the configured freshness window for review.',impact:'Helps teams work from current data and spot delayed updates.'}
    ];
    function App(){const [source,setSource]=useState('file'),[file,setFile]=useState(null),[drag,setDrag]=useState(false),[toast,setToast]=useState(''),[screen,setScreen]=useState(1),[selectedStreams,setSelectedStreams]=useState([]),[selectedDimensions,setSelectedDimensions]=useState(['integrity','consistency','uniqueness','conformity','completeness','accuracy','validity','timeliness']),[agentName,setAgentName]=useState('Data Quality Agent'),[objective,setObjective]=useState('Clean uploaded SAP data, preserve valid business meaning, and flag uncertain changes for review.'),[rules,setRules]=useState(starterRules),[newRuleName,setNewRuleName]=useState(''),[newRuleImpact,setNewRuleImpact]=useState(''),[newRuleDimension,setNewRuleDimension]=useState('completeness');const input=useRef(null);const notify=msg=>{setToast(msg);setTimeout(()=>setToast(''),2800)};const accept=f=>{if(!f)return;const ext=f.name.split('.').pop().toLowerCase();if(ext!=='csv'){notify('Please choose a CSV file.');return}setFile(f)};const fmt=n=>n<1024?`${n} B`:n<1048576?`${(n/1024).toFixed(1)} KB`:`${(n/1048576).toFixed(1)} MB`;const toggleStream=id=>setSelectedStreams(old=>old.includes(id)?old.filter(x=>x!==id):[...old,id]);const toggleDimension=id=>setSelectedDimensions(old=>old.includes(id)?old.filter(x=>x!==id):[...old,id]);const dimensionName=id=>dimensions.find(d=>d.id===id)?.name||'Other';const updateRule=(id,key,value)=>setRules(old=>old.map(r=>r.id===id?{...r,[key]:value}:r));const addRule=()=>{if(!newRuleName.trim()||!newRuleImpact.trim()){notify('Add a rule name and its functional impact first.');return}setRules(old=>[...old,{id:Date.now(),name:newRuleName.trim(),field:'Define field mapping after preview',dimension:newRuleDimension,group:'business',category:'Custom business rule',description:'Custom rule instruction. Refine its field mapping once the uploaded data is available.',impact:newRuleImpact.trim(),enabled:true}]);setNewRuleName('');setNewRuleImpact('')};const renderRule=r=><div key={r.id} className={'rule-card '+(r.enabled===false?'disabled':'')}><div className="rule-top"><input className="rule-toggle" type="checkbox" aria-label={`Enable ${r.name}`} checked={r.enabled!==false} onChange={e=>updateRule(r.id,'enabled',e.target.checked)}/><div className="rule-name-wrap"><div className="rule-name">{r.name}</div><div className="rule-meta">{dimensionName(r.dimension)} · Fields: {r.field}</div></div><button className="rule-remove" aria-label={`Remove ${r.name}`} onClick={()=>setRules(old=>old.filter(item=>item.id!==r.id))}>×</button></div><div className="rule-description">{r.description}</div><label className="impact-label" htmlFor={`impact-${r.id}`}><Icon name="layers" size={11}/> Functional impact</label><textarea id={`impact-${r.id}`} className="impact-input" value={r.impact} onChange={e=>updateRule(r.id,'impact',e.target.value)} placeholder="What downstream business process, control, or decision is affected?"/></div>;
      return <div className="app"><aside className="sidebar"><div className="brand"><div className="brand-mark"><Icon name="sparkle" size={19}/></div><div className="brand-copy"><div className="brand-name">Data Quality Agent</div><div className="brand-sub">SAP data cleansing</div></div></div><div className="workspace"><div className="workspace-icon">N</div><div><div className="workspace-label">Workspace</div><div className="workspace-name">Northstar Labs</div></div><span className="profile-more"><Icon name="chevron" size={14}/></span></div><nav><div className="nav-heading">Workspace</div><div className="nav-item"><Icon name="grid"/><span>Overview</span></div><div className="nav-item active"><Icon name="sparkle"/><span>Clean data</span><span className="nav-badge">New</span></div><div className="nav-item"><Icon name="layers"/><span>Datasets</span></div><div className="nav-item"><Icon name="clock"/><span>Activity</span></div><div className="nav-heading" style={{marginTop:27}}>Manage</div><div className="nav-item"><Icon name="settings"/><span>Settings</span></div></nav><div className="sidebar-bottom"><div className="help"><div className="help-title">Need a hand?</div><div className="help-copy">Learn how to prepare your data for a cleaner start.</div><a href="#guide" onClick={e=>{e.preventDefault();notify('Getting started guide coming soon.')}}>View getting started guide →</a></div><div className="profile"><div className="avatar">AR</div><div className="profile-copy"><div className="profile-name">Alex Rivera</div><div className="profile-role">Data analyst</div></div><span className="profile-more"><Icon name="chevron" size={14}/></span></div></div></aside>
      <main className="main"><header className="topbar"><div className="crumb">Workspace <span style={{color:'#ccd3d4',margin:'0 7px'}}>/</span> <strong>New cleaning job</strong></div><div className="top-actions"><button className="top-icon notify" aria-label="Notifications"><Icon name="bell" size={17}/></button><div className="top-avatar">AR</div></div></header><section className="content"><div className="eyebrow"><i className="eyebrow-line"/>New cleaning job</div><div className="hero"><div><h1>{screen===1?'Start with your data.':screen===2?'Choose your workstreams.':'Build your cleansing agent.'}</h1><p>{screen===1?'Choose where your data lives. We’ll help you get it clean and ready to use.':screen===2?'Select the SAP business processes you want to include in this cleansing job.':'Set the agent goal, cleansing rules, and business impact before previewing changes.'}</p></div><div className="stepper" aria-label={`Step ${screen} of 3`}><div className={'step '+(screen===1?'current':'done')}><span className="step-num">{screen===1?'1':<Icon name="check" size={12}/>}</span> Source</div><i className="step-connector"/><div className={'step '+(screen===2?'current':screen===3?'done':'')}><span className="step-num">{screen===3?<Icon name="check" size={12}/>:2}</span> Workstreams</div><i className="step-connector"/><div className={'step '+(screen===3?'current':'')}><span className="step-num">3</span> Agent</div></div></div>
      {screen===1?<>
      <div className="section-title">Choose a data source <span className="count">· 1 available</span></div><div className="cards" role="radiogroup" aria-label="Choose a data source"><SourceCard id="sap" title="SAP ECC" description="Connect to your SAP ERP data and bring business records into your workspace." kind="ERP connection" logo="sap-logo" selected={source==='sap'} onChoose={()=>setSource('sap')}/><SourceCard id="hana" title="SAP HANA" description="Access high-performance data from your SAP HANA database." kind="Database connection" logo="hana-logo" selected={source==='hana'} onChoose={()=>setSource('hana')}/><SourceCard id="file" title="File upload" description="Bring in a local file and get started with a quick data quality check." kind="Local file" logo="file-logo" selected={source==='file'} onChoose={()=>setSource('file')}/></div>
      <div className="upload-panel"><div className="upload-head"><div className="upload-title"><span className="upload-title-icon"><Icon name="file" size={17}/></span>Upload your file</div><span className="format-pill">CSV only</span></div><input ref={input} className="file-input" type="file" accept=".csv,text/csv" onChange={e=>accept(e.target.files?.[0])}/><div className={'dropzone '+(drag?'drag':'')} onClick={()=>input.current?.click()} onDragOver={e=>{e.preventDefault();setDrag(true)}} onDragLeave={()=>setDrag(false)} onDrop={e=>{e.preventDefault();setDrag(false);accept(e.dataTransfer.files?.[0])}} role="button" tabIndex="0" onKeyDown={e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();input.current?.click()}}}><div className="upload-icon"><span className="drop-icon"><Icon name="upload" size={18}/></span></div><div className="drop-title">{file?'File ready to go':<>Drop your CSV here, or <button type="button" onClick={e=>{e.stopPropagation();input.current?.click()}}>browse</button></>}</div><div className="drop-sub">{file?'You can remove it and choose another file anytime':'CSV only · Up to 100 MB'}</div>{file&&<div className="file-row" onClick={e=>e.stopPropagation()}><div className="file-chip"><Icon name="file" size={15}/></div><div className="file-details"><div className="file-name">{file.name}</div><div className="file-size">{fmt(file.size)}</div></div><button type="button" className="remove-file" aria-label="Remove file" onClick={()=>{setFile(null);if(input.current)input.current.value=''}}>×</button></div>}</div><div className="upload-note"><Icon name="shield" size={12}/> Your file stays private and is only used for this cleaning job.</div></div>
      <div className="continue-row"><div className="secure-note"><Icon name="help" size={14}/> Need help choosing? <a href="#support" style={{color:'#198077',textDecoration:'none',fontWeight:600}} onClick={e=>{e.preventDefault();notify('Our data team is here to help.')}}>Talk to our data team</a></div><div className="actions"><ui5-button design="Transparent" onClick={()=>{setFile(null);notify('Selection cleared.')}}>Cancel</ui5-button><ui5-button design="Emphasized" onClick={()=>{if(source!=='file'){notify('That connection option is coming soon. Choose File upload to continue.');return}if(!file){input.current?.click();return}setScreen(2)}}>Continue <span style={{marginLeft:8}}>→</span></ui5-button></div></div><div className="bottom-note">By continuing, you agree to our <a href="#terms">Terms of Service</a> and <a href="#privacy">Privacy Policy</a>.</div>
      </>:screen===2?<><div className="stream-intro"><div><div className="section-title">SAP end-to-end processes <span className="count">· choose all that apply</span></div><p>Choose one or more areas. You can update this selection later.</p></div><div className="selection-count">{selectedStreams.length} selected</div></div><div className="workstreams" role="group" aria-label="SAP workstreams">{streams.map(s=><div key={s.id} className={'stream-card '+(selectedStreams.includes(s.id)?'selected':'')} role="checkbox" aria-checked={selectedStreams.includes(s.id)} tabIndex="0" onClick={()=>toggleStream(s.id)} onKeyDown={e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggleStream(s.id)}}}><span className="stream-check"><Icon name="check" size={11}/></span><span className="stream-acronym">{s.code}</span><div className="stream-copy"><div className="stream-name">{s.name}</div><div className="stream-desc">{s.desc}</div><div className="stream-alias">{s.aliases}</div></div></div>)}</div><div className="stream-hint">SAP’s end-to-end process model groups core business activities into these workstreams. Source to Pay also covers Source to Settle (S2S) and Procure to Pay (P2P); Lead to Cash includes Order to Cash (O2C).</div><div className="continue-row"><div className="secure-note"><Icon name="file" size={14}/> {file?.name||'Your uploaded file'} <span style={{color:'#a0aaad'}}>·</span> <a href="#back" style={{color:'#198077',textDecoration:'none',fontWeight:600}} onClick={e=>{e.preventDefault();setScreen(1)}}>Change file</a></div><div className="actions"><ui5-button design="Transparent" onClick={()=>setScreen(1)}>Back</ui5-button><ui5-button design="Emphasized" onClick={()=>{if(!selectedStreams.length){notify('Choose at least one workstream to continue.');return}setScreen(3)}}>Build cleansing agent <span style={{marginLeft:8}}>→</span></ui5-button></div></div></>:<><div className="agent-layout"><div className="agent-main"><div className="agent-heading"><div className="agent-badge"><Icon name="sparkle" size={18}/></div><div><h2>Agent instructions</h2><p>Describe what good, clean data should look like for your team.</p></div></div><label className="field-label" htmlFor="agent-name">Agent name <span>Internal label</span></label><input id="agent-name" className="agent-input" value={agentName} onChange={e=>setAgentName(e.target.value)} placeholder="e.g. Finance data quality agent"/><label className="field-label" htmlFor="agent-objective">Agent goal <span>Natural language</span></label><textarea id="agent-objective" className="agent-textarea" value={objective} onChange={e=>setObjective(e.target.value)} placeholder="Tell the agent what to clean, what to preserve, and when to flag a record for review."/><div className="agent-subcopy">Be specific about what the agent may change and which records should be flagged for human review.</div><div className="dimension-block"><div className="rules-header"><div><strong>Data quality dimensions</strong><span>{selectedDimensions.length} selected</span></div><span>Choose the checks this agent should apply</span></div><div className="dimension-grid">{dimensions.map(d=><button type="button" key={d.id} className={'dimension-option '+(selectedDimensions.includes(d.id)?'selected':'')} aria-pressed={selectedDimensions.includes(d.id)} onClick={()=>toggleDimension(d.id)}><span className="dimension-check">✓</span><span className="dimension-option-copy"><strong>{d.name}</strong><small>{d.desc}</small></span></button>)}</div></div><div className="rule-sections"><div className="rule-section"><div className="rules-header"><div><span className="rule-section-title">Standard Rules</span><span className="rule-section-count">{rules.filter(r=>r.group==='standard'&&r.enabled!==false&&selectedDimensions.includes(r.dimension)).length} active</span></div><span className="rule-section-caption">Reusable data quality checks</span></div><div className="rule-list">{rules.filter(r=>r.group==='standard'&&selectedDimensions.includes(r.dimension)).map(renderRule)}</div></div><div className="rule-section"><div className="rules-header"><div><span className="rule-section-title">Business Rules</span><span className="rule-section-count">{rules.filter(r=>r.group==='business'&&r.enabled!==false&&selectedDimensions.includes(r.dimension)).length} active</span></div><span className="rule-section-caption">Rules tied to business operations</span></div><div className="rule-list">{rules.filter(r=>r.group==='business'&&selectedDimensions.includes(r.dimension)).map(renderRule)}</div></div></div><div className="create-rule-section"><div className="create-rule-heading"><div className="create-rule-icon">＋</div><div><div className="create-rule-title">Create a rule</div><div className="create-rule-caption">Add a custom business rule and explain its functional impact.</div></div></div><div className="add-rule-form"><select aria-label="Quality dimension for new rule" value={newRuleDimension} onChange={e=>setNewRuleDimension(e.target.value)}>{dimensions.map(d=><option key={d.id} value={d.id}>{d.name}</option>)}</select><input aria-label="New rule name" value={newRuleName} onChange={e=>setNewRuleName(e.target.value)} placeholder="New rule name, e.g. Validate tax ID"/><input aria-label="New rule functional impact" value={newRuleImpact} onChange={e=>setNewRuleImpact(e.target.value)} placeholder="Business impact if this rule is missed"/><button className="small-button" onClick={addRule}>＋ Create rule</button></div></div></div><aside className="agent-side"><div className="impact-preview"><div className="impact-preview-title"><Icon name="layers" size={14}/> Selected dimensions</div><p>The agent will organize standard and business rules around these data quality dimensions.</p><div className="impact-tags">{dimensions.filter(d=>selectedDimensions.includes(d.id)).map(d=><span className="impact-tag" key={d.id}>{d.name}</span>)}</div></div><div className="agent-side-title" style={{marginTop:18}}>Agent summary</div><div className="summary-line"><span>Agent</span><strong>{agentName||'Untitled agent'}</strong></div><div className="summary-line"><span>Dimensions</span><strong>{selectedDimensions.length}</strong></div><div className="summary-line"><span>Active rules</span><strong>{rules.filter(r=>r.enabled!==false&&selectedDimensions.includes(r.dimension)).length}</strong></div><div className="summary-line"><span>Input file</span><strong title={file?.name}>{file?.name?file.name.length>22?file.name.slice(0,19)+'…':file.name:'Selected'}</strong></div><div className="rule-impact-preview"><div className="mini-icon"><Icon name="shield" size={13}/></div><div><strong>Review before applying</strong>Rules can be configured now. Field matching and impact estimates should be confirmed against the uploaded file before any changes are applied.</div></div><p className="agent-note"><b>Prototype status:</b> this screen stores the agent setup in the page only. AI generation and data processing need a backend connection.</p></aside></div><div className="continue-row"><div className="secure-note"><Icon name="help" size={14}/> Keep uncertain changes flagged for review.</div><div className="actions"><ui5-button design="Transparent" onClick={()=>setScreen(2)}>Back to workstreams</ui5-button><ui5-button design="Emphasized" onClick={()=>{if(!agentName.trim()||!objective.trim()){notify('Add an agent name and goal before saving.');return}if(!selectedDimensions.length){notify('Choose at least one quality dimension.');return}if(!rules.some(r=>r.enabled!==false&&selectedDimensions.includes(r.dimension))){notify('Enable at least one cleansing rule for a selected dimension.');return}notify('Agent configuration saved in this prototype. Backend connection is still needed to run it.')}}>Save agent config <span style={{marginLeft:8}}>✓</span></ui5-button></div></div></>}
      </section></main>{toast&&<div className="toast" role="status">{toast}</div>}</div>}
    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
